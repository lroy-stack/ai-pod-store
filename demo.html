<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Shop — POD Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root {
  --bg: #FAFAFA;
  --bg-panel: rgba(255,255,255,0.72);
  --bg-panel-solid: #FFFFFF;
  --bg-input: #F5F5F7;
  --bg-hover: #F0F0F2;
  --text: #1D1D1F;
  --text-secondary: #86868B;
  --text-tertiary: #AEAEB2;
  --accent: #0071E3;
  --accent-hover: #0077ED;
  --accent-subtle: rgba(0,113,227,0.08);
  --border: rgba(0,0,0,0.06);
  --border-strong: rgba(0,0,0,0.1);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-pill: 100px;
  --glass: saturate(180%) blur(20px);
  --gen-gradient: linear-gradient(135deg, #667EEA 0%, #764BA2 40%, #F093FB 100%);
  --gen-gradient-subtle: linear-gradient(135deg, rgba(102,126,234,0.08), rgba(118,75,162,0.06), rgba(240,147,251,0.04));
  --gen-shimmer: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
}

html { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

/* ── LAYOUT ── */
#app {
  display: grid;
  grid-template-columns: 240px 1fr 340px;
  grid-template-rows: 1fr;
  height: 100vh;
  gap: 0;
}

/* ── SIDEBAR ── */
.sidebar {
  background: var(--bg-panel-solid);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow-y: auto;
  overflow-x: hidden;
}

.sidebar-header {
  padding: 20px 20px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-logo {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  background: var(--gen-gradient);
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 16px; font-weight: 600;
  position: relative; overflow: hidden;
}
.sidebar-logo::after {
  content: '';
  position: absolute; inset: 0;
  background: var(--gen-shimmer);
  background-size: 200% 100%;
  animation: shimmer 3s ease-in-out infinite;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

.sidebar-title { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }

.sidebar-nav { padding: 4px 12px; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s ease;
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 400;
  position: relative;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active { background: var(--accent-subtle); color: var(--accent); font-weight: 500; }
.nav-item .icon { width: 18px; text-align: center; font-size: 14px; opacity: 0.7; }
.nav-item.active .icon { opacity: 1; }

.sidebar-section {
  padding: 20px 20px 8px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-tertiary);
}

.sidebar-product {
  display: flex; gap: 10px; padding: 8px 16px;
  cursor: pointer; transition: background 0.15s;
  align-items: center;
}
.sidebar-product:hover { background: var(--bg-hover); }

.sidebar-product-img {
  width: 44px; height: 44px;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
  overflow: hidden;
}
.sidebar-product-info { flex: 1; min-width: 0; }
.sidebar-product-name { font-size: 12px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-product-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.sidebar-product-price { font-weight: 600; color: var(--text-secondary); }

.sidebar-footer {
  margin-top: auto;
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-tertiary);
  display: flex; align-items: center; gap: 6px;
}

.dot-pulse { width: 6px; height: 6px; border-radius: 50%; background: #34C759; flex-shrink: 0; }

/* ── CHAT PANEL ── */
.chat {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

.chat-header {
  padding: 16px 24px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
  z-index: 2;
}

.chat-search {
  flex: 1;
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-input);
  border-radius: var(--radius-pill);
  padding: 8px 16px;
  border: 1px solid transparent;
  transition: all 0.2s;
}
.chat-search:focus-within { border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(0,113,227,0.1); }
.chat-search svg { flex-shrink: 0; color: var(--text-tertiary); }
.chat-search input { border: none; background: none; outline: none; font-size: 13px; width: 100%; font-family: inherit; color: var(--text); }
.chat-search input::placeholder { color: var(--text-tertiary); }

.chat-header-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 36px; height: 36px;
  border-radius: var(--radius-sm);
  border: none; background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
  transition: all 0.15s;
  position: relative;
  font-size: 16px;
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }

.cart-badge {
  position: absolute; top: 4px; right: 4px;
  background: var(--accent);
  color: white;
  font-size: 9px; font-weight: 600;
  width: 16px; height: 16px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
}
.cart-badge.bounce { animation: bounce 0.4s ease; }
@keyframes bounce { 0%{transform:scale(1)} 50%{transform:scale(1.4)} 100%{transform:scale(1)} }

.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #667EEA, #764BA2);
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 12px; font-weight: 600;
  cursor: pointer;
}

/* messages area */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scroll-behavior: smooth;
}

.message { display: flex; gap: 10px; max-width: 85%; animation: fadeInUp 0.3s ease; }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message.ai { align-self: flex-start; }

@keyframes fadeInUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.message-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
}
.ai .message-avatar {
  background: var(--gen-gradient);
  color: white;
  font-weight: 600;
}
.user .message-avatar {
  background: var(--bg-input);
  color: var(--text-secondary);
}

.message-bubble {
  padding: 10px 14px;
  border-radius: var(--radius-lg);
  font-size: 13px;
  line-height: 1.5;
  letter-spacing: -0.1px;
}
.ai .message-bubble {
  background: var(--bg-panel-solid);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.user .message-bubble {
  background: var(--text);
  color: white;
  border-bottom-right-radius: 4px;
}

/* AI artifacts */
.artifact-design {
  margin-top: 10px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--bg-panel-solid);
}

.design-preview {
  width: 100%;
  aspect-ratio: 4/3;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: #F5F5F7;
}

.design-preview svg { width: 70%; height: 80%; }

.artifact-actions {
  display: flex; gap: 8px; padding: 12px;
}
.artifact-btn {
  flex: 1;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: white;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  color: var(--text);
}
.artifact-btn:hover { background: var(--bg-input); }
.artifact-btn.primary {
  background: var(--text);
  color: white;
  border-color: var(--text);
}
.artifact-btn.primary:hover { opacity: 0.85; }

/* product grid */
.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 10px;
}

.product-card {
  background: white;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s ease;
}
.product-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

.product-card-img {
  aspect-ratio: 3/4;
  position: relative;
  overflow: hidden;
}
.product-card-img .size-badge {
  position: absolute; top: 8px; left: 8px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(8px);
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-size: 10px;
  font-weight: 600;
  color: var(--text);
}

.product-card-body { padding: 10px; }
.product-card-name { font-size: 12px; font-weight: 500; line-height: 1.3; margin-bottom: 4px; }
.product-card-price { font-size: 13px; font-weight: 600; }
.product-card-rating { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

.product-card-action {
  width: 100%;
  padding: 6px;
  border: none;
  background: var(--bg-input);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  color: var(--text);
  margin-top: 8px;
  border-radius: var(--radius-sm);
}
.product-card-action:hover { background: var(--text); color: white; }

/* typing indicator */
.typing { display: flex; gap: 4px; padding: 12px 16px; align-items: center; }
.typing-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-tertiary);
  animation: typingBounce 1.2s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.15s; }
.typing-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes typingBounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

/* chat input */
.chat-input-bar {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  background: var(--bg-panel);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
}
.chat-input-wrap {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-panel-solid);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 6px 6px 6px 16px;
  transition: all 0.2s;
}
.chat-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,0.1); }

.chat-input {
  flex: 1; border: none; outline: none; background: none;
  font-size: 13px; font-family: inherit; color: var(--text);
  padding: 6px 0;
}
.chat-input::placeholder { color: var(--text-tertiary); }

.send-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--text);
  color: white;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}
.send-btn:hover { opacity: 0.8; transform: scale(1.05); }
.send-btn svg { width: 16px; height: 16px; }

/* ── DETAIL PANEL ── */
.detail {
  background: var(--bg-panel-solid);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.detail-header {
  padding: 16px 20px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: var(--bg-panel);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
  z-index: 2;
}

.back-btn {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  border: none; background: var(--bg-input);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
  transition: all 0.15s;
  flex-shrink: 0;
}
.back-btn:hover { background: var(--bg-hover); color: var(--text); }

.detail-header-title { font-size: 13px; font-weight: 500; }

.detail-image {
  aspect-ratio: 3/4;
  background: #F5F5F7;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}

.detail-thumbnails {
  display: flex; gap: 8px; padding: 12px 20px;
  overflow-x: auto;
}
.detail-thumb {
  width: 56px; height: 56px;
  border-radius: var(--radius-sm);
  border: 2px solid transparent;
  overflow: hidden;
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
  transition: border-color 0.15s;
}
.detail-thumb.active { border-color: var(--text); }
.detail-thumb:hover { border-color: var(--text-tertiary); }
.detail-thumb-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 600; text-align: center;
  color: var(--text-secondary);
  padding: 4px;
  line-height: 1.2;
  background: rgba(255,255,255,0.85);
}

.detail-info { padding: 16px 20px; }
.detail-name { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.3; }
.detail-price { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin-top: 4px; }

.detail-rating { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.stars { display: flex; gap: 1px; }
.star { color: #FFB800; font-size: 13px; }
.star.empty { color: var(--border-strong); }
.rating-count { font-size: 12px; color: var(--text-tertiary); }

.detail-sizes { padding: 0 20px; margin-top: 16px; }
.sizes-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-tertiary); margin-bottom: 8px; }
.sizes-row { display: flex; gap: 8px; }
.size-btn {
  width: 40px; height: 40px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: white;
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  color: var(--text);
}
.size-btn:hover { border-color: var(--text); }
.size-btn.active { background: var(--text); color: white; border-color: var(--text); }

.detail-cta {
  padding: 20px;
  margin-top: auto;
}
.cta-btn {
  width: 100%;
  padding: 14px;
  border-radius: var(--radius-md);
  border: none;
  background: var(--text);
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  letter-spacing: -0.2px;
}
.cta-btn:hover { opacity: 0.85; transform: translateY(-1px); box-shadow: var(--shadow-md); }
.cta-btn:active { transform: translateY(0); }

.detail-footer {
  padding: 0 20px 20px;
  text-align: center;
}
.detail-footer-text { font-size: 12px; color: var(--text-tertiary); display: flex; align-items: center; justify-content: center; gap: 6px; }
.detail-footer-text .dot-live { width: 6px; height: 6px; border-radius: 50%; background: #34C759; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.carousel-dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
.carousel-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); transition: all 0.2s; cursor: pointer; }
.carousel-dot.active { background: var(--text); width: 18px; border-radius: 3px; }

/* ── SCENARIO TABS ── */
.scenario-tabs {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  background: var(--bg-panel);
  backdrop-filter: var(--glass);
  -webkit-backdrop-filter: var(--glass);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 4px;
  box-shadow: var(--shadow-lg);
  z-index: 100;
}
.scenario-tab {
  padding: 8px 20px;
  border-radius: var(--radius-pill);
  border: none;
  background: none;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  color: var(--text-secondary);
  white-space: nowrap;
}
.scenario-tab.active { background: var(--text); color: white; }
.scenario-tab:not(.active):hover { background: var(--bg-hover); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text);
  color: white;
  padding: 10px 20px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 200;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── TRANSITIONS ── */
.chat-messages, .detail { transition: opacity 0.2s ease; }
.chat-messages.switching, .detail.switching { opacity: 0; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

/* ── GEN AI EFFECTS ── */
.gen-glow {
  position: relative;
}
.gen-glow::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  background: var(--gen-gradient);
  opacity: 0;
  transition: opacity 0.3s;
  z-index: -1;
}
.gen-glow:hover::before { opacity: 0.15; }

.gen-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  background: var(--gen-gradient-subtle);
  font-size: 10px;
  font-weight: 600;
  color: #764BA2;
}

/* ai welcome sparkle */
.sparkle-text {
  background: var(--gen-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 600;
}
</style>
</head>
<body>

<div id="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">A</div>
      <span class="sidebar-title">AI Shop</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-item active" data-nav="discover"><span class="icon">◎</span> Discover</div>
      <div class="nav-item" data-nav="trends"><span class="icon">↗</span> Trends</div>
      <div class="nav-item" data-nav="new"><span class="icon">✦</span> New Arrivals</div>
      <div class="nav-item" data-nav="favorites"><span class="icon">♡</span> Favorites</div>
      <div class="nav-item" data-nav="orders"><span class="icon">☐</span> Orders</div>
    </nav>

    <div class="sidebar-section">Recommended</div>

    <div class="sidebar-product" data-product="hoodie">
      <div class="sidebar-product-img" style="background:#1a1a1a;"></div>
      <div class="sidebar-product-info">
        <div class="sidebar-product-name">Minimalist Black Hoodie</div>
        <div class="sidebar-product-meta"><span class="sidebar-product-price">$39</span> <span>★★★ 309</span></div>
      </div>
    </div>

    <div class="sidebar-product" data-product="burrito">
      <div class="sidebar-product-img" style="background:linear-gradient(135deg,#FFE4B5,#F4A460);"></div>
      <div class="sidebar-product-info">
        <div class="sidebar-product-name">Burrito Lover Tee</div>
        <div class="sidebar-product-meta"><span class="sidebar-product-price">$44</span> <span>★★★ 343</span></div>
      </div>
    </div>

    <div class="sidebar-product" data-product="bundle">
      <div class="sidebar-product-img" style="background:linear-gradient(135deg,#555,#333);"></div>
      <div class="sidebar-product-info">
        <div class="sidebar-product-name">Bundle Deal 10% Off</div>
        <div class="sidebar-product-meta"><span class="sidebar-product-price">$44</span> <span>★★★★★ 1,493</span></div>
      </div>
    </div>

    <div class="sidebar-section">Popular today</div>

    <div class="sidebar-product" data-product="synthwave">
      <div class="sidebar-product-img" style="background:linear-gradient(135deg,#667EEA,#764BA2);"></div>
      <div class="sidebar-product-info">
        <div class="sidebar-product-name">AI Synthwave Tee</div>
        <div class="sidebar-product-meta"><span class="sidebar-product-price">$24.99</span> <span class="dot-pulse" style="display:inline-block;width:5px;height:5px;"></span> <span>viewing</span></div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="dot-pulse"></div>
      <span>Last design generated 9m ago</span>
    </div>
  </aside>

  <!-- CHAT -->
  <main class="chat">
    <div class="chat-header">
      <div class="chat-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search products, designs, ideas...">
      </div>
      <div class="chat-header-actions">
        <button class="icon-btn" title="Notifications">🔔</button>
        <button class="icon-btn" id="cartBtn" title="Cart">
          <span>🛒</span>
          <span class="cart-badge" id="cartBadge">2</span>
        </button>
        <div class="avatar">LR</div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input-bar">
      <div class="chat-input-wrap">
        <input type="text" class="chat-input" id="chatInput" placeholder="Describe a design or search for products...">
        <button class="send-btn" id="sendBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- DETAIL PANEL -->
  <aside class="detail" id="detailPanel"></aside>
</div>

<!-- SCENARIO TABS -->
<div class="scenario-tabs">
  <button class="scenario-tab active" data-scenario="1">✦ AI Design</button>
  <button class="scenario-tab" data-scenario="2">Search Products</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const state = {
  scenario: 1,
  selectedSize: 'M',
  cartCount: 2,
};

// ── SVG GENERATORS ──
function sunsetDesignSVG(w = 240, h = 200) {
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${w}" height="${h}" rx="12" fill="#1a1a1a"/>
    <rect x="70" y="20" width="100" height="130" rx="4" fill="#111"/>
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2a1a3a"/>
        <stop offset="50%" stop-color="#FF6B4A"/>
        <stop offset="100%" stop-color="#FFB347"/>
      </linearGradient>
      <radialGradient id="sun" cx="0.5" cy="0.6" r="0.25">
        <stop offset="0%" stop-color="#FFD700"/>
        <stop offset="100%" stop-color="#FF6B4A"/>
      </radialGradient>
    </defs>
    <rect x="80" y="35" width="80" height="55" rx="2" fill="url(#sky)"/>
    <circle cx="120" cy="62" r="12" fill="url(#sun)" opacity="0.9"/>
    <rect x="80" y="68" width="80" height="22" fill="#1a3a5a" opacity="0.6"/>
    <line x1="80" y1="72" x2="160" y2="72" stroke="#FFB347" stroke-width="0.5" opacity="0.4"/>
    <line x1="80" y1="76" x2="160" y2="76" stroke="#FFB347" stroke-width="0.3" opacity="0.3"/>
    <path d="M95 68 L93 50 Q95 45 97 50 L95 68Z" fill="#0a1a0a" opacity="0.8"/>
    <path d="M93 52 Q88 48 85 50" stroke="#0a1a0a" stroke-width="1.5" fill="none" opacity="0.8"/>
    <path d="M97 50 Q102 46 105 48" stroke="#0a1a0a" stroke-width="1.5" fill="none" opacity="0.8"/>
    <path d="M145 68 L143 52 Q145 47 147 52 L145 68Z" fill="#0a1a0a" opacity="0.8"/>
    <path d="M143 54 Q138 50 135 52" stroke="#0a1a0a" stroke-width="1.5" fill="none" opacity="0.8"/>
    <text x="120" y="108" text-anchor="middle" fill="#555" font-size="6" font-family="Inter,sans-serif">SUNSET VIBES</text>
    <text x="120" y="${h - 15}" text-anchor="middle" fill="#555" font-size="8" font-family="Inter,sans-serif" font-weight="500">AI Generated Design</text>
  </svg>`;
}

function dressGradient(type) {
  const gradients = {
    bodycon: 'background:#1a1a1a;',
    satin: 'background:linear-gradient(170deg,#2a2a2a,#1a1a1a);',
    maxi: 'background:linear-gradient(180deg,#0f0f0f,#2a2a2a);',
  };
  return gradients[type] || 'background:#1a1a1a;';
}

function starsHTML(rating, count) {
  let html = '<div class="stars">';
  for (let i = 1; i <= 5; i++) {
    html += `<span class="star${i > Math.floor(rating) ? (i - rating < 1 ? '' : ' empty') : ''}">★</span>`;
  }
  html += `</div><span class="rating-count">${count}</span>`;
  return html;
}

// ── SCENARIOS ──
const scenarios = {
  1: {
    searchText: 'Black t-shirt sunset design',
    messages: [
      {
        role: 'ai',
        content: `Hey! I'm your <span class="sparkle-text">AI design assistant</span>. I can help you create unique print-on-demand products. What would you like to design today?`
      },
      {
        role: 'user',
        content: 'Quiero una camiseta negra con un diseño de atardecer en la playa, con palmeras y colores cálidos.'
      },
      {
        role: 'ai',
        content: `Love it! I've generated a sunset beach design with warm oranges and palm silhouettes. Here's a preview on a black tee:`,
        artifact: 'design-preview'
      }
    ],
    panel: {
      type: 'design',
      title: 'Unisex Jersey Short Sleeve Tee',
      price: '$27',
      rating: 3.5,
      ratingCount: '209 reviews',
      cta: 'Create Product',
      thumbnails: ['Create Product', 'Create Poster', 'Color Variants']
    }
  },
  2: {
    searchText: 'Black dresses, size S',
    messages: [
      {
        role: 'ai',
        content: `Welcome back! I can help you find the perfect product or create something new. What are you looking for?`
      },
      {
        role: 'user',
        content: 'Show me black dresses, size S'
      },
      {
        role: 'ai',
        content: `Here are 3 black dresses available in size S:`,
        artifact: 'product-grid'
      }
    ],
    panel: {
      type: 'search',
      title: 'Satin Slip Dress',
      price: '$54',
      rating: 4,
      ratingCount: '209 reviews',
      cta: '+ Add to Cart',
      viewing: 5
    }
  }
};

const dressProducts = [
  { name: 'Black Bodycon Dress', price: '$49', rating: 4, reviews: 156, type: 'bodycon' },
  { name: 'Satin Slip Dress', price: '$54', rating: 4, reviews: 209, type: 'satin' },
  { name: 'Elegant Maxi Dress', price: '$59', rating: 4.5, reviews: 342, type: 'maxi' }
];

const sidebarProducts = {
  hoodie: { title: 'Minimalist Black Hoodie', price: '$39', rating: 3, ratingCount: '309 reviews', bg: '#1a1a1a' },
  burrito: { title: 'Burrito Lover Tee', price: '$44', rating: 3, ratingCount: '343 reviews', bg: 'linear-gradient(135deg,#FFE4B5,#F4A460)' },
  bundle: { title: 'Bundle Deal — 10% Off', price: '$44', rating: 5, ratingCount: '1,493 reviews', bg: 'linear-gradient(135deg,#555,#333)' },
  synthwave: { title: 'AI Synthwave Tee', price: '$24.99', rating: 4, ratingCount: '87 reviews', bg: 'linear-gradient(135deg,#667EEA,#764BA2)' }
};

// ── RENDERERS ──
function renderMessages(scenarioId) {
  const el = document.getElementById('chatMessages');
  const s = scenarios[scenarioId];
  let html = '';

  s.messages.forEach(msg => {
    const avatarContent = msg.role === 'ai' ? '✦' : 'LR';
    html += `<div class="message ${msg.role}">
      <div class="message-avatar">${avatarContent}</div>
      <div>
        <div class="message-bubble">${msg.content}</div>`;

    if (msg.artifact === 'design-preview') {
      html += `<div class="artifact-design">
        <div class="design-preview">${sunsetDesignSVG(280, 220)}</div>
        <div class="artifact-actions">
          <button class="artifact-btn" onclick="showToast('Generating new variant...')">Change</button>
          <button class="artifact-btn primary" onclick="addToCart()">Create Product</button>
        </div>
      </div>`;
    }

    if (msg.artifact === 'product-grid') {
      html += `<div class="product-grid">`;
      dressProducts.forEach((p, i) => {
        html += `<div class="product-card" onclick="selectDressProduct(${i})">
          <div class="product-card-img" style="${dressGradient(p.type)}">
            <div class="size-badge">S</div>
          </div>
          <div class="product-card-body">
            <div class="product-card-name">${p.name}</div>
            <div class="product-card-price">${p.price}</div>
            <div class="product-card-rating">${'★'.repeat(Math.floor(p.rating))}${'☆'.repeat(5 - Math.floor(p.rating))} ${p.reviews}</div>
            <button class="product-card-action" onclick="event.stopPropagation();addToCart()">Add to Cart</button>
          </div>
        </div>`;
      });
      html += `</div>`;
    }

    html += `</div></div>`;
  });

  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

function renderDetail(scenarioId, product) {
  const el = document.getElementById('detailPanel');
  const s = scenarios[scenarioId].panel;
  const data = product || s;

  let imageStyle, imageContent;
  if (product && product.bg) {
    imageStyle = `background: ${data.bg};`;
    imageContent = '';
  } else if (data.type === 'design') {
    imageStyle = 'background: #F5F5F7;';
    imageContent = sunsetDesignSVG(320, 300);
  } else {
    imageStyle = dressGradient('satin');
    imageContent = '';
  }

  let html = `
    <div class="detail-header">
      <button class="back-btn">←</button>
      <span class="detail-header-title">${data.title}</span>
    </div>
    <div class="detail-image" style="${imageStyle}">${imageContent}</div>`;

  if (data.type === 'design') {
    html += `<div class="detail-thumbnails">
      ${data.thumbnails.map((t, i) => `<div class="detail-thumb ${i === 0 ? 'active' : ''}">
        <div style="width:100%;height:100%;background:${i === 0 ? '#F5F5F7' : i === 1 ? '#E8E8ED' : 'linear-gradient(135deg,#667EEA22,#764BA222)'};"></div>
        <div class="detail-thumb-label">${t}</div>
      </div>`).join('')}
    </div>`;
  }

  html += `<div class="detail-info">
    <div class="detail-name">${data.title}</div>
    <div class="detail-price">${data.price}</div>
    <div class="detail-rating">${starsHTML(data.rating, data.ratingCount)}</div>
  </div>

  <div class="detail-sizes">
    <div class="sizes-label">Size</div>
    <div class="sizes-row">
      ${['S','M','L'].map(s => `<button class="size-btn ${s === state.selectedSize ? 'active' : ''}" onclick="selectSize('${s}')">${s}</button>`).join('')}
    </div>
  </div>

  <div class="detail-cta">
    <button class="cta-btn" onclick="addToCart()">${data.cta || 'Add to Cart'}</button>
  </div>`;

  if (data.viewing) {
    html += `<div class="detail-footer">
      <div class="detail-footer-text"><span class="dot-live"></span> ${data.viewing} people are viewing this</div>
      <div class="carousel-dots">
        ${[0,1,2,3,4].map(i => `<div class="carousel-dot ${i === 1 ? 'active' : ''}"></div>`).join('')}
      </div>
    </div>`;
  }

  el.innerHTML = html;
}

// ── INTERACTIONS ──
function selectSize(size) {
  state.selectedSize = size;
  document.querySelectorAll('.size-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === size);
  });
}

function addToCart() {
  state.cartCount++;
  const badge = document.getElementById('cartBadge');
  badge.textContent = state.cartCount;
  badge.classList.remove('bounce');
  void badge.offsetWidth;
  badge.classList.add('bounce');
  showToast('Added to cart ✓');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function switchScenario(id) {
  if (state.scenario === id) return;
  state.scenario = id;
  state.selectedSize = 'M';

  document.querySelectorAll('.scenario-tab').forEach(t => {
    t.classList.toggle('active', parseInt(t.dataset.scenario) === id);
  });

  const msgs = document.getElementById('chatMessages');
  const detail = document.getElementById('detailPanel');
  msgs.classList.add('switching');
  detail.classList.add('switching');

  setTimeout(() => {
    renderMessages(id);
    renderDetail(id);
    document.getElementById('searchInput').value = scenarios[id].searchText;
    msgs.classList.remove('switching');
    detail.classList.remove('switching');
  }, 200);
}

function selectDressProduct(idx) {
  const p = dressProducts[idx];
  renderDetail(2, {
    type: 'search',
    title: p.name,
    price: p.price,
    rating: p.rating,
    ratingCount: `${p.reviews} reviews`,
    cta: '+ Add to Cart',
    viewing: Math.floor(Math.random() * 8) + 2,
    bg: null
  });
}

function handleSidebarProduct(key) {
  const p = sidebarProducts[key];
  if (!p) return;
  renderDetail(state.scenario, {
    type: 'search',
    title: p.title,
    price: p.price,
    rating: p.rating,
    ratingCount: p.ratingCount,
    cta: '+ Add to Cart',
    viewing: Math.floor(Math.random() * 10) + 1,
    bg: p.bg
  });
}

// ── SIMULATED AI CHAT ──
const aiResponses = {
  dress: {
    text: 'Here are some dress options I found for you:',
    artifact: 'product-grid'
  },
  design: {
    text: `Great idea! Here's a preview of your custom design on a black tee:`,
    artifact: 'design-preview'
  },
  default: {
    text: `I can help you find products or create unique designs. Try describing a design idea (like "sunset beach t-shirt") or search for specific products (like "black dresses").`,
    artifact: null
  }
};

function getAIResponse(input) {
  const lower = input.toLowerCase();
  if (/dress|vestido|falda|skirt/.test(lower)) return aiResponses.dress;
  if (/design|diseño|camiseta|shirt|tee|logo|create|genera/.test(lower)) return aiResponses.design;
  return aiResponses.default;
}

function addUserMessage(text) {
  const el = document.getElementById('chatMessages');

  // user bubble
  const userMsg = document.createElement('div');
  userMsg.className = 'message user';
  userMsg.innerHTML = `<div class="message-avatar">LR</div><div><div class="message-bubble">${escapeHtml(text)}</div></div>`;
  el.appendChild(userMsg);
  el.scrollTop = el.scrollHeight;

  // typing indicator
  const typingMsg = document.createElement('div');
  typingMsg.className = 'message ai';
  typingMsg.innerHTML = `<div class="message-avatar">✦</div><div><div class="message-bubble"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div>`;
  el.appendChild(typingMsg);
  el.scrollTop = el.scrollHeight;

  setTimeout(() => {
    el.removeChild(typingMsg);
    const response = getAIResponse(text);

    let artifactHTML = '';
    if (response.artifact === 'design-preview') {
      artifactHTML = `<div class="artifact-design">
        <div class="design-preview">${sunsetDesignSVG(280, 220)}</div>
        <div class="artifact-actions">
          <button class="artifact-btn" onclick="showToast('Generating new variant...')">Change</button>
          <button class="artifact-btn primary" onclick="addToCart()">Create Product</button>
        </div>
      </div>`;
    } else if (response.artifact === 'product-grid') {
      artifactHTML = `<div class="product-grid">`;
      dressProducts.forEach((p, i) => {
        artifactHTML += `<div class="product-card" onclick="selectDressProduct(${i})">
          <div class="product-card-img" style="${dressGradient(p.type)}"><div class="size-badge">S</div></div>
          <div class="product-card-body">
            <div class="product-card-name">${p.name}</div>
            <div class="product-card-price">${p.price}</div>
            <div class="product-card-rating">${'★'.repeat(Math.floor(p.rating))}${'☆'.repeat(5 - Math.floor(p.rating))} ${p.reviews}</div>
            <button class="product-card-action" onclick="event.stopPropagation();addToCart()">Add to Cart</button>
          </div>
        </div>`;
      });
      artifactHTML += `</div>`;
    }

    const aiMsg = document.createElement('div');
    aiMsg.className = 'message ai';
    aiMsg.innerHTML = `<div class="message-avatar">✦</div><div><div class="message-bubble">${response.text}</div>${artifactHTML}</div>`;
    el.appendChild(aiMsg);
    el.scrollTop = el.scrollHeight;
  }, 1500);
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ── EVENT LISTENERS ──
document.querySelectorAll('.scenario-tab').forEach(tab => {
  tab.addEventListener('click', () => switchScenario(parseInt(tab.dataset.scenario)));
});

document.getElementById('sendBtn').addEventListener('click', () => {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addUserMessage(text);
});

document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('sendBtn').click();
});

document.querySelectorAll('.sidebar-product').forEach(el => {
  el.addEventListener('click', () => handleSidebarProduct(el.dataset.product));
});

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
  });
});

// ── INIT ──
renderMessages(1);
renderDetail(1);
document.getElementById('searchInput').value = scenarios[1].searchText;
</script>
</body>
</html>
