<svg xmlns="http://www.w3.org/2000/svg" width="3531" height="2908" viewBox="0 0 3531 2908">

  <!-- ============================================= -->
  <!-- "AI Raised Me"                                -->
  <!-- Kids Hoodie BP67 — Jet Black, Oxford Navy,    -->
  <!--   Sky Blue, Sun Yellow                        -->
  <!-- Canvas landscape 3531x2908                    -->
  <!-- Chat UI: kid asks AI how to tie shoes         -->
  <!-- Burbujas: KID derecha, AI izquierda           -->
  <!-- Título: púrpura (visible en claro Y oscuro)   -->
  <!-- ============================================= -->

  <!-- === ROBOT KAWAII — arriba centrado, grande === -->
  <g transform="translate(1765, 420)">
    <!-- Antena -->
    <line x1="0" y1="-240" x2="0" y2="-340" stroke="#40ACCC" stroke-width="18"/>
    <circle cx="0" cy="-365" r="38" fill="#F59E0B"/>
    <!-- Sparkle en antena -->
    <line x1="-18" y1="-365" x2="18" y2="-365" stroke="white" stroke-width="8"/>
    <line x1="0" y1="-383" x2="0" y2="-347" stroke="white" stroke-width="8"/>

    <!-- Cabeza robot — redondeada -->
    <rect x="-220" y="-240" width="440" height="380" rx="70" fill="#40ACCC"/>

    <!-- Orejas/tornillos -->
    <circle cx="-240" cy="-50" r="30" fill="#2B8CA3"/>
    <circle cx="240" cy="-50" r="30" fill="#2B8CA3"/>
    <circle cx="-240" cy="-50" r="12" fill="#0F172A"/>
    <circle cx="240" cy="-50" r="12" fill="#0F172A"/>

    <!-- Ojos — grandes, kawaii -->
    <rect x="-140" y="-170" width="110" height="100" rx="20" fill="#0F172A"/>
    <rect x="30" y="-170" width="110" height="100" rx="20" fill="#0F172A"/>
    <!-- Brillos -->
    <rect x="-125" y="-155" width="40" height="35" rx="8" fill="white" opacity="0.9"/>
    <rect x="45" y="-155" width="40" height="35" rx="8" fill="white" opacity="0.9"/>
    <circle cx="-95" cy="-110" r="10" fill="white" opacity="0.5"/>
    <circle cx="75" cy="-110" r="10" fill="white" opacity="0.5"/>

    <!-- Sonrisa feliz -->
    <path d="M-70,30 Q0,90 70,30" fill="none" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>

    <!-- Mejillas -->
    <circle cx="-170" cy="10" r="40" fill="#F472B6" opacity="0.4"/>
    <circle cx="170" cy="10" r="40" fill="#F472B6" opacity="0.4"/>

    <!-- Cuerpo pequeño debajo -->
    <rect x="-140" y="155" width="280" height="130" rx="40" fill="#40ACCC"/>
    <!-- Botones -->
    <circle cx="-50" cy="215" r="16" fill="#0F172A" opacity="0.3"/>
    <circle cx="50" cy="215" r="16" fill="#0F172A" opacity="0.3"/>
    <!-- Brazos -->
    <line x1="-140" y1="200" x2="-220" y2="260" stroke="#40ACCC" stroke-width="24" stroke-linecap="round"/>
    <line x1="140" y1="200" x2="220" y2="260" stroke="#40ACCC" stroke-width="24" stroke-linecap="round"/>
    <!-- Manos -->
    <circle cx="-228" cy="268" r="22" fill="#2B8CA3"/>
    <circle cx="228" cy="268" r="22" fill="#2B8CA3"/>
  </g>

  <!-- === "AI" label sobre el robot === -->
  <rect x="1690" y="65" width="150" height="70" rx="35" fill="#A78BFA"/>
  <text x="1765" y="116" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="42" font-weight="900" fill="white" text-anchor="middle">AI</text>

  <!-- === CHAT BUBBLES — KID derecha, AI izquierda === -->

  <!-- Burbuja KID pregunta (DERECHA, turquesa) -->
  <g transform="translate(1930, 900)">
    <!-- Burbuja -->
    <rect x="0" y="0" width="1400" height="250" rx="60" fill="#40ACCC"/>
    <!-- Pico derecha abajo -->
    <polygon points="1280,250 1340,320 1200,250" fill="#40ACCC"/>
    <!-- Texto -->
    <text x="700" y="110" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="150" font-weight="800" fill="white" text-anchor="middle">How do I tie</text>
    <text x="700" y="220" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="150" font-weight="800" fill="white" text-anchor="middle">my shoes?</text>
  </g>



  <!-- Burbuja AI respuesta (IZQUIERDA, púrpura) -->
  <g transform="translate(200, 1350)">
    <!-- Burbuja -->
    <rect x="0" y="0" width="2200" height="360" rx="60" fill="#A78BFA"/>
    <!-- Pico izquierda abajo -->
    <polygon points="200,360 140,430 280,360" fill="#A78BFA"/>
    <!-- Texto -->
    <text x="1100" y="120" font-family="'Courier New', monospace" font-size="140" fill="white" text-anchor="middle">I'd be happy to help!</text>
    <text x="1100" y="260" font-family="'Courier New', monospace" font-size="130" fill="white" text-anchor="middle">Step 1: Take the lace...</text>
  </g>



  <!-- Burbuja KID punchline (DERECHA, turquesa) -->
  <g transform="translate(1380, 1880)">
    <!-- Burbuja -->
    <rect x="0" y="0" width="1950" height="200" rx="60" fill="#40ACCC"/>
    <!-- Pico derecha -->
    <polygon points="1830,200 1890,260 1750,200" fill="#40ACCC"/>
    <!-- Texto — punchline -->
    <text x="975" y="145" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="160" font-weight="900" fill="white" text-anchor="middle">Just use velcro</text>
  </g>

  <!-- === TITLE: AI RAISED ME — púrpura fuerte (visible en claro y oscuro) === -->
  <text x="1765" y="2520" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="380" font-weight="900" fill="#A78BFA" text-anchor="middle" letter-spacing="-8">AI RAISED ME</text>

  <!-- Subtitle monospace — turquesa VISIBLE -->
  <text x="1765" y="2720" font-family="'Courier New', monospace" font-size="170" fill="#40ACCC" text-anchor="middle" opacity="0.8">generation alpha loading...</text>

  <!-- === DECORACIONES === -->

  <!-- Estrellas grandes -->
  <g transform="translate(250, 200)" opacity="0.6">
    <polygon points="0,-60 15,-20 60,-20 24,6 38,48 0,26 -38,48 -24,6 -60,-20 -15,-20" fill="#FDE047"/>
  </g>
  <g transform="translate(3300, 180)" opacity="0.55">
    <polygon points="0,-55 14,-18 55,-18 22,6 35,46 0,24 -35,46 -22,6 -55,-18 -14,-18" fill="#FDE047"/>
  </g>
  <g transform="translate(150, 1600)" opacity="0.4">
    <polygon points="0,-45 12,-15 45,-15 18,5 28,38 0,20 -28,38 -18,5 -45,-15 -12,-15" fill="#FDE047"/>
  </g>
  <g transform="translate(3400, 2400)" opacity="0.45">
    <polygon points="0,-50 13,-16 50,-16 20,6 31,42 0,22 -31,42 -20,6 -50,-16 -13,-16" fill="#FDE047"/>
  </g>

  <!-- Corazones VISIBLES -->
  <text x="200" y="750" font-family="'Arial', sans-serif" font-size="200" fill="#F472B6" opacity="0.45">&lt;3</text>
  <text x="3200" y="2700" font-family="'Arial', sans-serif" font-size="180" fill="#F472B6" opacity="0.4">&lt;3</text>

  <!-- Puntos flotantes — más visibles -->
  <circle cx="500" cy="400" r="18" fill="#A78BFA" opacity="0.45"/>
  <circle cx="3100" cy="500" r="16" fill="#40ACCC" opacity="0.4"/>
  <circle cx="400" cy="2300" r="20" fill="#F59E0B" opacity="0.35"/>
  <circle cx="3200" cy="1200" r="16" fill="#F472B6" opacity="0.4"/>

  <!-- Wifi/señal cerca del robot -->
  <g transform="translate(2100, 250)" opacity="0.35">
    <path d="M-60,0 Q0,-50 60,0" fill="none" stroke="#40ACCC" stroke-width="10" stroke-linecap="round"/>
    <path d="M-40,0 Q0,-35 40,0" fill="none" stroke="#40ACCC" stroke-width="10" stroke-linecap="round"/>
    <path d="M-20,0 Q0,-18 20,0" fill="none" stroke="#40ACCC" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Icono zapato velcro flotando -->
  <g transform="translate(350, 900)" opacity="0.2">
    <rect x="0" y="0" width="200" height="120" rx="30" fill="#40ACCC"/>
    <rect x="60" y="20" width="80" height="30" rx="8" fill="white"/>
    <rect x="60" y="60" width="80" height="30" rx="8" fill="white"/>
  </g>

</svg>