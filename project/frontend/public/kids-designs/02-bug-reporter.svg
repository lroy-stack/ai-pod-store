<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="3800" viewBox="0 0 3000 3800">

  <!-- ============================================= -->
  <!-- Bug Reporter (Junior Dev) — Baby T-Shirt      -->
  <!-- TODO más grande, más visible, más protagonismo -->
  <!-- ============================================= -->

  <!-- === MAIN BADGE — tilted === -->
  <g transform="translate(1500, 1700) rotate(-2)">
    <!-- Card shadow -->
    <rect x="-1050" y="-1200" width="2100" height="2500" rx="80" fill="#0F172A" opacity="0.1" transform="translate(15,15)"/>
    <!-- Card background — blanco semi para contraste en dark -->
    <rect x="-1050" y="-1200" width="2100" height="2500" rx="80" fill="white" opacity="0.85"/>
    <!-- Card border -->
    <rect x="-1050" y="-1200" width="2100" height="2500" rx="80" fill="none" stroke="#0F172A" stroke-width="18" opacity="0.3"/>

    <!-- Lanyard clip -->
    <rect x="-60" y="-1260" width="120" height="120" rx="20" fill="#CBD5E1" opacity="0.5"/>
    <circle cx="0" cy="-1200" r="25" fill="none" stroke="#0F172A" stroke-width="8" opacity="0.3"/>

    <!-- SKAPARA INC. — más visible -->
    <text x="0" y="-1000" font-family="'Courier New', monospace" font-size="170" fill="#0F172A" text-anchor="middle" letter-spacing="8" opacity="0.65">SKAPARA INC.</text>

    <!-- Red line — más gruesa -->
    <rect x="-900" y="-900" width="1800" height="14" rx="7" fill="#EF4444" opacity="0.6"/>

    <!-- ROLE label — más visible -->
    <text x="-880" y="-730" font-family="'Courier New', monospace" font-size="170" fill="#0F172A" opacity="0.6">ROLE:</text>

    <!-- BUG REPORTER -->
    <text x="0" y="-420" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="360" font-weight="900" fill="#EF4444" text-anchor="middle" letter-spacing="-6">BUG</text>
    <text x="0" y="-60" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="340" font-weight="900" fill="#EF4444" text-anchor="middle" letter-spacing="-6">REPORTER</text>

    <!-- ( Junior Dev ) — más bold -->
    <text x="0" y="200" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="230" font-weight="800" fill="#0F172A" text-anchor="middle" opacity="0.8">( Junior Dev )</text>

    <!-- Level pill — más visible -->
    <rect x="-500" y="310" width="1000" height="200" rx="100" fill="#0F172A" opacity="0.1"/>
    <text x="0" y="445" font-family="'Courier New', monospace" font-size="170" fill="#0F172A" text-anchor="middle" opacity="0.55">Level 0</text>

    <!-- STATUS: ACTIVE — PROTAGONISTA -->
    <rect x="-600" y="580" width="1200" height="220" rx="110" fill="#10B981" opacity="0.15"/>
    <text x="0" y="730" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="180" font-weight="900" fill="#10B981" text-anchor="middle">STATUS: ACTIVE</text>

    <!-- bugs found: ∞ — más visible -->
    <text x="0" y="980" font-family="'Courier New', monospace" font-size="180" fill="#EF4444" opacity="0.5" text-anchor="middle">bugs found: ∞</text>
  </g>

  <!-- === THE BIG LADYBUG — ON TOP of badge === -->
  <g transform="translate(2200, 750) rotate(15)">
    <ellipse cx="0" cy="0" rx="250" ry="200" fill="#EF4444"/>
    <line x1="0" y1="-200" x2="0" y2="200" stroke="#0F172A" stroke-width="8" opacity="0.2"/>
    <circle cx="-90" cy="-40" r="35" fill="#0F172A" opacity="0.15"/>
    <circle cx="95" cy="-35" r="35" fill="#0F172A" opacity="0.15"/>
    <circle cx="-55" cy="80" r="28" fill="#0F172A" opacity="0.12"/>
    <circle cx="70" cy="75" r="28" fill="#0F172A" opacity="0.12"/>
    <circle cx="0" cy="-240" r="120" fill="#0F172A"/>
    <circle cx="-48" cy="-268" r="45" fill="white"/>
    <circle cx="48" cy="-268" r="45" fill="white"/>
    <circle cx="-34" cy="-264" r="22" fill="#0F172A"/>
    <circle cx="62" cy="-264" r="22" fill="#0F172A"/>
    <circle cx="-44" cy="-274" r="9" fill="white"/>
    <circle cx="52" cy="-274" r="9" fill="white"/>
    <path d="M-40,-215 Q0,-185 40,-215" fill="none" stroke="white" stroke-width="10" stroke-linecap="round"/>
    <path d="M-45,-355 Q-110,-450 -75,-480" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-70" cy="-495" r="24" fill="#F59E0B"/>
    <path d="M45,-355 Q110,-450 75,-480" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>
    <circle cx="70" cy="-495" r="24" fill="#10B981"/>
    <line x1="-225" y1="-30" x2="-340" y2="-90" stroke="#0F172A" stroke-width="12" stroke-linecap="round"/>
    <line x1="-240" y1="40" x2="-360" y2="40" stroke="#0F172A" stroke-width="12" stroke-linecap="round"/>
    <line x1="-220" y1="110" x2="-330" y2="165" stroke="#0F172A" stroke-width="12" stroke-linecap="round"/>
    <line x1="225" y1="-30" x2="340" y2="-90" stroke="#0F172A" stroke-width="12" stroke-linecap="round"/>
    <line x1="240" y1="40" x2="360" y2="40" stroke="#0F172A" stroke-width="12" stroke-linecap="round"/>
    <line x1="220" y1="110" x2="330" y2="165" stroke="#0F172A" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-350" cy="-100" r="15" fill="#0F172A"/>
    <circle cx="-370" cy="40" r="15" fill="#0F172A"/>
    <circle cx="-340" cy="175" r="15" fill="#0F172A"/>
    <circle cx="350" cy="-100" r="15" fill="#0F172A"/>
    <circle cx="370" cy="40" r="15" fill="#0F172A"/>
    <circle cx="340" cy="175" r="15" fill="#0F172A"/>
  </g>

  <!-- === SMALL BUG bottom-left — más grande y visible === -->
  <g transform="translate(400, 3250) rotate(-20)">
    <ellipse cx="0" cy="0" rx="110" ry="80" fill="#EF4444" opacity="0.7"/>
    <circle cx="0" cy="-100" r="52" fill="#0F172A" opacity="0.7"/>
    <circle cx="-20" cy="-110" r="20" fill="white" opacity="0.7"/>
    <circle cx="20" cy="-110" r="20" fill="white" opacity="0.7"/>
    <line x1="-20" y1="-148" x2="-45" y2="-195" stroke="#0F172A" stroke-width="7" opacity="0.6" stroke-linecap="round"/>
    <line x1="20" y1="-148" x2="45" y2="-195" stroke="#0F172A" stroke-width="7" opacity="0.6" stroke-linecap="round"/>
    <circle cx="-50" cy="-200" r="14" fill="#F59E0B" opacity="0.6"/>
    <circle cx="50" cy="-200" r="14" fill="#10B981" opacity="0.6"/>
    <!-- Huellas más visibles -->
    <circle cx="160" cy="40" r="8" fill="#0F172A" opacity="0.2"/>
    <circle cx="240" cy="20" r="7" fill="#0F172A" opacity="0.15"/>
    <circle cx="320" cy="35" r="8" fill="#0F172A" opacity="0.1"/>
  </g>

  <!-- === Bottom-right bug — más grande === -->
  <g transform="translate(2500, 3350) rotate(12)">
    <ellipse cx="0" cy="0" rx="95" ry="68" fill="#EF4444" opacity="0.6"/>
    <circle cx="0" cy="-85" r="45" fill="#0F172A" opacity="0.6"/>
    <circle cx="-16" cy="-94" r="16" fill="white" opacity="0.6"/>
    <circle cx="16" cy="-94" r="16" fill="white" opacity="0.6"/>
    <line x1="-16" y1="-126" x2="-38" y2="-165" stroke="#0F172A" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
    <line x1="16" y1="-126" x2="38" y2="-165" stroke="#0F172A" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom floating text — ENORME -->
  <text x="1500" y="3600" font-family="'Courier New', monospace" font-size="250" fill="#0F172A" opacity="0.45" text-anchor="middle">// they're everywhere</text>

</svg>