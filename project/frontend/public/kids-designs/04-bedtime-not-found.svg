  </g>
  <g transform="translate(150, 1700)" opacity="0.55">
    <polygon points="0,-75 19,-24 75,-24 30,8 47,62 0,32 -47,62 -30,8 -75,-24 -19,-24" fill="#FDE047"/>
  </g>
  <g transform="translate(3250, 1500)" opacity="0.6">
    <polygon points="0,-70 18,-22 70,-22 28,8 44,58 0,30 -44,58 -28,8 -70,-22 -18,-22" fill="#FDE047"/>
  </g>
  <g transform="translate(500, 3000)" opacity="0.5">
    <polygon points="0,-65 17,-21 65,-21 26,7 41,54 0,28 -41,54 -26,7 -65,-21 -17,-21" fill="#FDE047"/>
  </g>
  <g transform="translate(2900, 2900)" opacity="0.55">
