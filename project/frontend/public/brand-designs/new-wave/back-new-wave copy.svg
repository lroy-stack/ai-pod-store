<!-- SKAPARA New Wave — Back Design
     Canvas: 1800×2400 @150dpi (12" × 16")
     Placement: back (M2480 Cat 411)
     Style: Streetwear poster — bold geometric, checkerboard, arrows
     Colors: White #FFFFFF, Turquoise #40ACCC, Amber #F59E0B, faint grey accents
     For use on: M2480 dark colors (Black, Navy Blazer, Charcoal Heather, Vintage Black)

     Layout zones (top to bottom):
       A: y=80-200    — Decorative header (chevrons, mini marks)
       B: y=200-420   — "SKAPARA" text block with geometric frame
       C: y=420-1340  — S mark hero with accent elements
       D: y=1340-1620 — "PUSH FORWARD" text with geometric bars
       E: y=1620-1860 — "STAY AHEAD" banner with stars
       F: y=1860-2320 — Decorative footer (patterns, lines, arrows)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 2400" width="1800" height="2400">
  <defs>
    <style>
      .wh { fill: #FFFFFF; }
      .tq { fill: #40ACCC; }
      .am { fill: #F59E0B; }
    </style>
  </defs>

  <!-- ===== ZONE A: Decorative Header ===== -->

  <!-- Top chevron arrows (pointing right) -->
  <polygon class="tq" points="140,100 180,130 140,160"/>
  <polygon class="wh" points="200,100 240,130 200,160"/>
  <polygon class="tq" points="260,100 300,130 260,160"/>

  <!-- Mini checkerboard cluster (top-left) -->
  <rect class="wh" x="380" y="95" width="28" height="28"/>
  <rect class="tq" x="412" y="95" width="28" height="28"/>
  <rect class="tq" x="380" y="127" width="28" height="28"/>
  <rect class="wh" x="412" y="127" width="28" height="28"/>

  <!-- Horizontal accent line -->
  <rect class="am" x="480" y="120" width="320" height="6" rx="3"/>

  <!-- Mini S mark (right side, small) -->
  <g transform="translate(1380,70) scale(0.06)" opacity="0.4">
    <g transform="translate(-241.6,1623.4) scale(0.1,-0.1)" fill="#40ACCC" stroke="none">
      <path d="M7650 16230 c-185 -6 -231 -11 -445 -46 -195 -33 -362 -80 -570 -161 -321 -127 -594 -320 -761 -542 -35 -46 -64 -90 -64 -96 0 -7 9 -24 21 -39 20 -25 20 -28 5 -67 -22 -55 -22 -298 0 -377 61 -220 130 -319 316 -459 147 -110 299 -186 608 -307 52 -20 111 -43 130 -51 19 -7 89 -34 155 -60 66 -25 136 -52 155 -60 218 -84 326 -126 390 -150 22 -8 57 -21 78 -29 20 -8 80 -31 132 -51 52 -20 133 -54 180 -75 47 -21 173 -75 280 -120 107 -45 222 -95 254 -112 l59 -29 111 11 c80 8 939 11 3106 10 l2995 -2 80 21 c114 30 227 88 322 165 100 81 121 107 215 271 41 72 119 207 173 300 54 94 154 269 222 390 69 121 139 243 157 270 18 28 63 106 101 175 108 197 268 477 346 607 66 109 216 373 296 520 31 56 32 63 17 77 -14 15 -206 16 -2067 17 -1129 1 -3121 2 -4427 3 -1306 1 -2463 -1 -2570 -4z"/>
    </g>
  </g>

  <!-- Top-right decorative dots -->
  <circle class="am" cx="1560" cy="105" r="8"/>
  <circle class="wh" cx="1590" cy="105" r="8"/>
  <circle class="am" cx="1620" cy="105" r="8"/>
  <rect class="wh" x="1540" y="130" width="100" height="4"/>

