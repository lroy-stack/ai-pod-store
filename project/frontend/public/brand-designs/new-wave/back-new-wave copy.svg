  <!-- Horizontal line set -->
  <rect class="tq" x="300" y="1900" width="500" height="4"/>
  <rect class="am" x="820" y="1900" width="680" height="4"/>

  <!-- Dashed effect line -->
  <rect class="wh" x="300" y="1920" width="60" height="4"/>
  <rect class="wh" x="380" y="1920" width="60" height="4"/>
  <rect class="wh" x="460" y="1920" width="60" height="4"/>
  <rect class="wh" x="540" y="1920" width="60" height="4"/>
  <rect class="wh" x="620" y="1920" width="60" height="4"/>

