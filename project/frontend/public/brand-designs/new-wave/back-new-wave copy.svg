  <polygon class="wh" points="1500,1940 1540,1970 1500,2000"/>
  <polygon class="tq" points="1560,1940 1600,1970 1560,2000"/>

  <!-- Bottom checkerboard (larger) -->
  <rect class="wh" x="300" y="1960" width="30" height="30"/>
  <rect class="tq" x="334" y="1960" width="30" height="30"/>
  <rect class="am" x="368" y="1960" width="30" height="30"/>
  <rect class="tq" x="300" y="1994" width="30" height="30"/>
  <rect class="am" x="334" y="1994" width="30" height="30"/>
  <rect class="wh" x="368" y="1994" width="30" height="30"/>

  <!-- Bottom decorative bars -->
  <rect class="tq" x="500" y="2060" width="800" height="10" rx="5"/>
  <rect class="am" x="600" y="2090" width="600" height="6" rx="3"/>
  <rect class="wh" x="700" y="2110" width="400" height="4" rx="2" opacity="0.5"/>

  <!-- Arrow lines (bottom-left) -->
