  <rect class="am" x="1674" y="240" width="20" height="20"/>
  <rect class="am" x="1650" y="264" width="20" height="20"/>
  <rect class="wh" x="1674" y="264" width="20" height="20"/>
  <rect class="wh" x="1650" y="288" width="20" height="20"/>
  <rect class="am" x="1674" y="288" width="20" height="20"/>

  <!-- Thin amber line under header -->
