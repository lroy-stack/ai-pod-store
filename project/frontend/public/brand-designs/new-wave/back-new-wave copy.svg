  <!-- Vertical line accents at very bottom -->
  <rect class="wh" x="860" y="2150" width="4" height="80" opacity="0.3"/>
  <rect class="tq" x="880" y="2140" width="4" height="100" opacity="0.4"/>
  <rect class="am" x="900" y="2150" width="4" height="80" opacity="0.3"/>
  <rect class="wh" x="920" y="2160" width="4" height="60" opacity="0.2"/>
  <rect class="tq" x="940" y="2150" width="4" height="80" opacity="0.3"/>

