<svg xmlns="http://www.w3.org/2000/svg" width="4606" height="5787" viewBox="0 0 4606 5787">

  <!-- E05: "Main Character Energy" — BP6 T-Shirt 4606x5787 -->
  <!-- Bold statement with self-deprecating twist -->
  <!-- Palette: Amber (#F59E0B) + Violet (#8B5CF6) -->
  <!-- Fonts: Lato (hero), Dancing Script (subtitle) -->
  <!-- RULE: No text below 200px -->

  <!-- ===== "MAIN" — 3D amber block ===== -->
  <text x="2323" y="1520"
        font-family="'Lato', sans-serif"
        font-size="1100" font-weight="700"
        fill="#92400E" text-anchor="middle">MAIN</text>
  <text x="2313" y="1510"
        font-family="'Lato', sans-serif"
        font-size="1100" font-weight="700"
        fill="#D97706" text-anchor="middle">MAIN</text>
  <text x="2303" y="1500"
        font-family="'Lato', sans-serif"
        font-size="1100" font-weight="700"
        fill="#F59E0B" text-anchor="middle">MAIN</text>

  <!-- ===== "CHARACTER" — 3D amber block ===== -->
  <text x="2323" y="2620"
        font-family="'Lato', sans-serif"
        font-size="780" font-weight="700"
        fill="#92400E" text-anchor="middle">CHARACTER</text>
  <text x="2313" y="2610"
        font-family="'Lato', sans-serif"
        font-size="780" font-weight="700"
        fill="#D97706" text-anchor="middle">CHARACTER</text>
  <text x="2303" y="2600"
        font-family="'Lato', sans-serif"
        font-size="780" font-weight="700"
        fill="#F59E0B" text-anchor="middle">CHARACTER</text>

  <!-- ===== "ENERGY" — 3D violet block ===== -->
  <text x="2323" y="3720"
        font-family="'Montserrat', sans-serif"
        font-size="1000" font-weight="700"
        fill="#4C1D95" text-anchor="middle"
        letter-spacing="15">ENERGY</text>
  <text x="2313" y="3710"
        font-family="'Montserrat', sans-serif"
        font-size="1000" font-weight="700"
        fill="#6D28D9" text-anchor="middle"
        letter-spacing="15">ENERGY</text>
  <text x="2303" y="3700"
        font-family="'Montserrat', sans-serif"
        font-size="1000" font-weight="700"
        fill="#8B5CF6" text-anchor="middle"
        letter-spacing="15">ENERGY</text>

  <!-- ===== "*side character budget" — Dancing Script, off-white ===== -->
  <text x="2303" y="4400"
        font-family="'Dancing Script', cursive"
        font-size="320"
        fill="#F0EDE8" text-anchor="middle">*side character budget</text>

</svg>
