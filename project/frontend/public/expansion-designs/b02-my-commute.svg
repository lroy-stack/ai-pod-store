<svg xmlns="http://www.w3.org/2000/svg" width="4606" height="5787" viewBox="0 0 4606 5787">

  <!-- B02: "My Commute Is 7 Seconds" — BP6 T-Shirt 4606x5787 -->
  <!-- Pattern C: Extreme Minimalism — big hero number, lots of air -->
  <!-- Accent: #10B981 (green) -->
  <!-- Fonts: Caveat (setup), Oswald (hero number), Bebas Neue (unit), Courier New (footer) -->

  <!-- "my commute is" — Caveat handwritten, off-white -->
  <text x="2303" y="2000"
        font-family="'Caveat', cursive"
        font-size="500"
        fill="#F0EDE8" text-anchor="middle">my commute is</text>

  <!-- "7" shadow (+12,+12) — dark green depth -->
  <text x="2315" y="3412"
        font-family="'Oswald', sans-serif"
        font-size="1400" font-weight="700"
        fill="#065F46" text-anchor="middle">7</text>

  <!-- "7" — Oswald bold, hero number, green -->
  <text x="2303" y="3400"
        font-family="'Oswald', sans-serif"
        font-size="1400" font-weight="700"
        fill="#10B981" text-anchor="middle">7</text>

  <!-- "SECONDS" — Bebas Neue condensed, off-white -->
  <text x="2303" y="3900"
        font-family="'Bebas Neue', sans-serif"
        font-size="500"
        fill="#F0EDE8" text-anchor="middle">SECONDS</text>

  <!-- "bed → desk" — Courier New, muted gray -->
  <text x="2303" y="4500"
        font-family="'Courier New', monospace"
        font-size="250" font-weight="bold"
        fill="#6B7280" text-anchor="middle">bed → desk</text>

</svg>
