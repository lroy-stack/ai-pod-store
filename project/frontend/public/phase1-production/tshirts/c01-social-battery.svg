<svg xmlns="http://www.w3.org/2000/svg" width="4606" height="5787" viewBox="0 0 4606 5787">

  <!-- C01: "Social Battery: 3%" — BP6 T-Shirt 4606x5787 -->
  <!-- Pattern C: Minimalism + big icon -->
  <!-- Accent: #EF4444 (red/low battery) -->
  <!-- Fonts: Caveat (label), Bebas Neue (percentage), Courier New (footer) -->

  <!-- "social battery" — Caveat, off-white -->
  <text x="2303" y="1500"
        font-family="'Caveat', cursive"
        font-size="500"
        fill="#F0EDE8" text-anchor="middle">social battery</text>

  <!-- ===== Battery icon — BIG horizontal ===== -->

  <!-- Battery body outline -->
  <rect x="803" y="1800" width="3000" height="800" rx="100"
        fill="none" stroke="#F0EDE8" stroke-width="30"/>

  <!-- Battery terminal nub -->
  <rect x="3803" y="2050" width="100" height="300" rx="25"
        fill="#F0EDE8"/>

  <!-- Battery fill — only 3%, red -->
  <rect x="833" y="1830" width="88" height="740" rx="20"
        fill="#EF4444"/>

  <!-- ===== "3%" hero text ===== -->

  <!-- Shadow (+12,+12) -->
  <text x="2315" y="3712"
        font-family="'Bebas Neue', sans-serif"
        font-size="1200"
        fill="#7F1D1D" text-anchor="middle">3%</text>

  <!-- Main — red -->
  <text x="2303" y="3700"
        font-family="'Bebas Neue', sans-serif"
        font-size="1200"
        fill="#EF4444" text-anchor="middle">3%</text>

  <!-- Footer -->
  <text x="2303" y="4400"
        font-family="'Courier New', monospace"
        font-size="180" font-weight="bold"
        fill="#6B7280" text-anchor="middle">do not disturb</text>

</svg>
