# POD AI — Docker Compose (Complete Self-Hosted Stack)
# =====================================================
#
# Services:
#   frontend   — Next.js 16 storefront (port 3000)
#   admin      — Next.js 16 admin panel (port 3001)
#   podclaw    — Python agent system with FastAPI bridge (port 8000)
#   mcp-server — MCP server for AI assistant tools (port 8002)
#   rembg      — Background removal sidecar with u2net (port 8080)
#   redis      — Session cache, rate limiting, queues (port 6379)
#   crawl4ai   — Web crawler with JS rendering (port 11235)
#   prometheus — Metrics collection and monitoring (port 9090)
#   caddy      — Reverse proxy with automatic HTTPS (ports 80, 443)
#
# Supabase is cloud-managed (NOT self-hosted).
#
# Quick start:
#   ./start.sh --local
#
# Manual:
#   docker compose up -d                                           # base only
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d  # local dev
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d   # production

# ---------------------------------------------------------------------------
# Reusable fragments (YAML anchors)
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-security: &default-security
  cap_drop:
    - ALL

services:
  # ---------------------------------------------------------------------------
  # Frontend — Next.js 16
  # ---------------------------------------------------------------------------
  frontend:
    <<: *default-security
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@podai.com}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PODCLAW_BRIDGE_URL: http://podclaw:8000
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      PRINTIFY_WEBHOOK_SECRET: ${PRINTIFY_WEBHOOK_SECRET:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      SUPPORTED_LOCALES: ${SUPPORTED_LOCALES:-en,es,de}
    depends_on:
      redis: { condition: service_healthy }
      podclaw: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 384M }
        reservations: { memory: 256M }
    networks: [proxy, data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Admin — Next.js 16 Admin Panel (Store + PodClaw Management)
  # ---------------------------------------------------------------------------
  admin:
    <<: *default-security
    build:
      context: ./admin
      dockerfile: Dockerfile
      additional_contexts:
        frontend-messages: ./frontend/messages
      args:
        ADMIN_BASE_PATH: "/panel"
        SUPABASE_URL: ${SUPABASE_URL}
        SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      ADMIN_BASE_PATH: "/panel"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      PODCLAW_BRIDGE_URL: http://podclaw:8000
      PODCLAW_BRIDGE_AUTH_TOKEN: ${PODCLAW_BRIDGE_AUTH_TOKEN}
    depends_on:
      podclaw: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { memory: 128M }
    networks: [proxy]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/panel/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # PodClaw — Autonomous Agent System + FastAPI Bridge
  # ---------------------------------------------------------------------------
  podclaw:
    <<: *default-security
    build:
      context: .
      dockerfile: deploy/Dockerfile
    expose:
      - "8000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      PRINTIFY_API_TOKEN: ${PRINTIFY_API_TOKEN}
      PRINTIFY_SHOP_ID: ${PRINTIFY_SHOP_ID}
      PRINTIFY_WEBHOOK_SECRET: ${PRINTIFY_WEBHOOK_SECRET:-}
      FAL_KEY: ${FAL_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@podai.com}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PODCLAW_ADMIN_TELEGRAM_CHAT_ID: ${PODCLAW_ADMIN_TELEGRAM_CHAT_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      PODCLAW_BRIDGE_AUTH_TOKEN: ${PODCLAW_BRIDGE_AUTH_TOKEN}
      REMBG_URL: http://rembg:8080
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CRAWL4AI_URL: http://crawl4ai:11235
    volumes:
      - podclaw-data:/app/podclaw/data
      - podclaw-memory:/app/podclaw/memory
    depends_on:
      redis: { condition: service_healthy }
      rembg: { condition: service_healthy }
      crawl4ai: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }
        reservations: { memory: 256M }
    networks: [proxy, data, ai-services]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # rembg — Local Background Removal (u2net, zero cloud cost)
  # ---------------------------------------------------------------------------
  rembg:
    <<: *default-security
    build:
      context: deploy/rembg
    expose:
      - "8080"
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 768M }
        reservations: { memory: 512M }
    networks: [ai-services]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Redis — Session cache, rate limiting, queues
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
      --rename-command CONFIG ""
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { memory: 128M }
    networks: [data]
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping 2>/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Crawl4AI — Web crawler with JavaScript rendering (port 11235)
  # ---------------------------------------------------------------------------
  crawl4ai:
    image: unclecode/crawl4ai:0.8.0
    expose:
      - "11235"
    environment:
      MAX_CONCURRENT_TASKS: "1"
      CRAWL4AI_API_TOKEN: ""
    volumes:
      - crawl4ai-output:/app/output
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 768M }
        reservations: { memory: 384M }
    shm_size: 512m
    networks: [ai-services]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11235/monitor/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # MCP Server — Model Context Protocol (AI assistant tools, port 8002)
  # ---------------------------------------------------------------------------
  mcp-server:
    <<: *default-security
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    expose:
      - "8002"
    environment:
      NODE_ENV: production
      PORT: "8002"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      MCP_JWT_SECRET: ${MCP_JWT_SECRET}
      MCP_BASE_URL: "https://${DOMAIN:-localhost}/mcp"
      MCP_CORS_ORIGINS: "https://claude.ai,https://chatgpt.com"
      FRONTEND_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { memory: 128M }
    networks: [proxy, data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Prometheus — Metrics Collection and Monitoring
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.0.0
    expose:
      - "9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
        reservations: { memory: 256M }
    networks: [proxy, data]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Caddy — Reverse Proxy with Automatic HTTPS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.9-alpine
    expose:
      - "80"
      - "443"
    environment:
      CADDY_SITE_ADDRESS: ${DOMAIN:-http://localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend: { condition: service_healthy }
      admin: { condition: service_healthy }
      podclaw: { condition: service_healthy }
      mcp-server: { condition: service_healthy }
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 64M }
        reservations: { memory: 32M }
    networks: [proxy]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging: *default-logging

# ---------------------------------------------------------------------------
# Named Volumes
# ---------------------------------------------------------------------------
volumes:
  podclaw-data:      # PodClaw brain state (SQLite DB)
  podclaw-memory:    # PodClaw memory logs and context files
  redis-data:        # Redis AOF persistence
  crawl4ai-output:   # Crawl4AI scraped data and cache
  prometheus-data:   # Prometheus TSDB (15 days retention)
  caddy-data:        # TLS certificates
  caddy-config:      # Caddy runtime config

# ---------------------------------------------------------------------------
# Networks — Segmented for isolation
# ---------------------------------------------------------------------------
#   proxy:       Caddy <-> frontend, admin, podclaw, mcp-server
#   data:        frontend, podclaw, mcp-server <-> Redis
#   ai-services: podclaw <-> rembg, crawl4ai (untrusted workloads isolated)
networks:
  proxy:
    driver: bridge
  data:
    driver: bridge
  ai-services:
    driver: bridge
