# PodClaw — Docker Compose
# Run: docker compose -f deploy/docker-compose.yml up -d

services:
  podclaw:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../frontend/.env.local
    volumes:
      - podclaw-data:/app/podclaw/data  # PodClaw brain state (SQLite)
    restart: unless-stopped

  rembg:
    build:
      context: rembg
    ports:
      - "7000:7000"
    restart: unless-stopped

volumes:
  podclaw-data:
