# POD AI — Docker Compose (Complete Self-Hosted Stack)
# =====================================================
#
# Services:
#   frontend   — Next.js 16 storefront (port 3000)
#   admin      — Next.js 16 admin panel (port 3001)
#   podclaw    — Python agent system with FastAPI bridge (port 8000)
#   mcp-server — MCP server for AI assistant tools (port 8002)
#   rembg      — Background removal sidecar with u2net (port 8080)
#   redis      — Session cache, rate limiting, queues (port 6379)
#   caddy      — Reverse proxy with automatic HTTPS (ports 80, 443)
#
# Supabase is cloud-managed (NOT self-hosted).
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml logs -f
#
# Local dev (Docker Desktop):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml up -d

services:
  # ---------------------------------------------------------------------------
  # Frontend — Next.js 16
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    # No external ports in base — Caddy is the public entry point.
    # Override in docker-compose.local.yml for direct debug access.
    env_file:
      - ../frontend/.env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      PODCLAW_BRIDGE_URL: http://podclaw:8000
    depends_on:
      redis:
        condition: service_healthy
      podclaw:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
        reservations:
          memory: 256M
    networks:
      - proxy
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # Admin — Next.js 16 Admin Panel (Store + PodClaw Management)
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        ADMIN_BASE_PATH: "/panel"
    # No external ports in base — Caddy proxies /panel → admin:3001.
    env_file:
      - ../admin/.env.local
    environment:
      NODE_ENV: production
      PORT: "3001"
      ADMIN_BASE_PATH: "/panel"
      PODCLAW_BRIDGE_URL: http://podclaw:8000
    depends_on:
      podclaw:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/panel/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # PodClaw — Autonomous Agent System + FastAPI Bridge
  # ---------------------------------------------------------------------------
  podclaw:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # No external ports in base — Caddy proxies /api/bridge → podclaw:8000.
    env_file:
      - ../frontend/.env.local
    environment:
      REMBG_URL: http://rembg:8080
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
    volumes:
      - podclaw-data:/app/podclaw/data
      - podclaw-memory:/app/podclaw/memory
    depends_on:
      redis:
        condition: service_healthy
      rembg:
        condition: service_healthy
      crawl4ai:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - proxy
      - data
      - ai-services
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ---------------------------------------------------------------------------
  # rembg — Local Background Removal (u2net, zero cloud cost)
  # ---------------------------------------------------------------------------
  rembg:
    build:
      context: rembg
    # No external port — accessed only via Docker network (podclaw → rembg:8080)
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          memory: 384M
    networks:
      - ai-services
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ---------------------------------------------------------------------------
  # Redis — Session cache, rate limiting, queues
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    # No external port in base — override in local/prod as needed
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
      --rename-command CONFIG ""
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping 2>/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Crawl4AI — Lightweight web crawler with JavaScript rendering (port 11235)
  # ---------------------------------------------------------------------------
  crawl4ai:
    image: unclecode/crawl4ai:0.8.0
    # Internal service only — no external port exposure
    environment:
      MAX_CONCURRENT_TASKS: "1"
      CRAWL4AI_API_TOKEN: ""
    volumes:
      - crawl4ai-output:/app/output
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 384M
    shm_size: 512m
    networks:
      - ai-services
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11235/monitor/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ---------------------------------------------------------------------------
  # MCP Server — Model Context Protocol (AI assistant tools, port 8002)
  # ---------------------------------------------------------------------------
  mcp-server:
    build:
      context: ../mcp-server
      dockerfile: Dockerfile
    # No external ports in base — Caddy proxies /mcp → mcp-server:8002.
    env_file:
      - ../frontend/.env.local
    environment:
      NODE_ENV: production
      PORT: "8002"
      MCP_BASE_URL: "https://${DOMAIN:-localhost}/mcp"
      MCP_CORS_ORIGINS: "https://claude.ai,https://chatgpt.com"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - proxy
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ---------------------------------------------------------------------------
  # Caddy — Reverse Proxy with Automatic HTTPS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.9-alpine
    # Ports defined in override files (local: 8080, prod: 80+443)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
      podclaw:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 64M
        reservations:
          memory: 32M
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

# ---------------------------------------------------------------------------
# Named Volumes
# ---------------------------------------------------------------------------
volumes:
  podclaw-data:      # PodClaw brain state (SQLite DB)
  podclaw-memory:    # PodClaw memory logs and context files
  redis-data:        # Redis AOF persistence
  crawl4ai-output:   # Crawl4AI scraped data and cache
  caddy-data:        # TLS certificates
  caddy-config:      # Caddy runtime config

# ---------------------------------------------------------------------------
# Networks — Segmented for isolation
# ---------------------------------------------------------------------------
#   proxy:       Caddy ↔ frontend, admin, podclaw, mcp-server
#   data:        frontend, podclaw, mcp-server ↔ Redis
#   ai-services: podclaw ↔ rembg, crawl4ai (untrusted workloads isolated)
networks:
  proxy:
    driver: bridge
  data:
    driver: bridge
  ai-services:
    driver: bridge
